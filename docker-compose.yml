# Base de données de développement local pour Anach Car.
# Lancer : docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: anach-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anach
      POSTGRES_PASSWORD: anach
      POSTGRES_DB: anach_car
    ports:
      - "5433:5432"
    volumes:
      - anach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anach -d anach_car"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anach_pgdata:
